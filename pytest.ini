[pytest]
pythonpath = .
testpaths = tests

addopts = -v --tb=short -n auto --alluredir=allure-results

log_cli = true
log_cli_level = INFO
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)

log_file = test.log
log_file_level = DEBUG
