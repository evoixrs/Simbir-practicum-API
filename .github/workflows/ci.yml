name: Run API Tests

on:
  push:
    branches: [main, training/api-tests]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: api-tests

      - name: Checkout test service
        uses: actions/checkout@v4
        with:
          repository: evoixrs/test-service
          path: test-service

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -zxvf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      - name: Start test service
        working-directory: test-service
        run: |
          docker compose up --build -d

      - name: Wait for test service
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/time; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f test-service/docker-compose.yaml ps
          docker compose -f test-service/docker-compose.yaml logs
          exit 1

      - name: Install dependencies
        working-directory: api-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        working-directory: api-tests
        run: mkdir -p allure-results reports

      - name: Run API tests
        working-directory: api-tests
        run: |
          pytest --base-url=http://localhost:8080 --junitxml=reports/results.xml

      - name: Generate Allure report
        if: always()
        working-directory: api-tests
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            api-tests/reports/results.xml
            api-tests/allure-results/
            api-tests/test.log

      - name: Upload Allure report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-tests/allure-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
